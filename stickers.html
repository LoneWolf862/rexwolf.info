<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Stickers | RexWolf</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/stickers.css">
</head>
<body>
<main class="sticker-page">
  <section class="sticker-hero">
    <a class="back-link" href="/index.html">← Back home</a>
    <p class="eyebrow">W00F86 Sticker Collection</p>
    <h1>Rex Stickers</h1>
    <p class="sticker-intro">A growing collection of Rex stickers. Tap any sticker to view it full size or download the original transparent image.</p>
    <div class="sticker-pack-links">
      <a class="pack-button telegram" href="https://t.me/addstickers/W00F86" target="_blank" rel="noopener">Add the Telegram pack</a>
      <a class="pack-button apple" href="https://www.apple.com/app-store/" target="_blank" rel="noopener">View the Apple sticker pack</a>
    </div>
  </section>
  <section class="sticker-gallery-section">
    <div class="sticker-section-heading"><div><p class="eyebrow">Gallery</p><h2>All Stickers</h2></div><p id="sticker-count"></p></div>
    <div id="sticker-grid" class="sticker-grid"></div>
  </section>
</main>
<div id="sticker-lightbox" class="sticker-lightbox" hidden>
  <button class="lightbox-close" type="button" aria-label="Close">×</button>
  <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous">‹</button>
  <figure class="lightbox-figure">
    <div class="lightbox-image-stage"><img id="lightbox-image" alt=""></div>
    <figcaption><h2 id="lightbox-title"></h2><p id="lightbox-caption"></p><a id="lightbox-download" class="lightbox-download" download>Download original PNG</a></figcaption>
  </figure>
  <button class="lightbox-nav lightbox-next" type="button" aria-label="Next">›</button>
</div>
<script src="/sticker-data.js?v=1"></script>
<script src="/stickers.js?v=1"></script>
</body></html>
